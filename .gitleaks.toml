title = "FinText Alpha Vectorizer gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for documentation placeholders, tests, build dirs, and non-secret dev configs"
paths = [
  '''\.env\.example$''',
  '''config/config\.yaml$''',
  '''(^|/)\.env$''',
  '''(^|/)_archive/''',
  '''(^|/)scratch/''',
  '''(^|/)target/''',
  '''(^|/)venv/''',
  '''(^|/)\.venv/''',
]

regexes = [
  '''sk_live_xxxx''',
  '''sk_test_mock_stripe_key_for_dev''',
  '''your_polygon_api_key_here''',
  '''your_finnhub_api_key_here''',
  '''whsec_xxxx''',
  '''POSTGRES_PASSWORD:\s*fintext''',
  '''POSTGRES_USER:\s*fintext''',
  '''postgres://fintext:fintext@localhost:5432/fintext_metadata''',
  '''https://hooks\.slack\.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX''',
  '''ft_1234567890abcdef1234567890abcdef''',
  '''ft_9876543210fedcba9876543210fedcba''',
  '''sec_k9x2m4p8q1w7r3t5y8u2i4o6p9a1s3d5''',
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''c12345testkeyabcdef67890''',
  '''ft_invalid_bogus_api_key_12345''',
  '''verification-test-jwt-secret-99999''',
  '''fintext-admin-dev-secret-token''',
  '''fintext-admin-dev''',
  '''your_admin_token''',
  '''your_admin_token_here''',
  # SHA256 hashes in models_manifest.json (public checksums, not secrets)
  '''[a-fA-F0-9]{64}''',
]

[[allowlists]]
description = "Model manifest with public SHA256 checksums"
paths = ['''config/models_manifest\.json$''']

