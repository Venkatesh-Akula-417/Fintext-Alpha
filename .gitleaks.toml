title = "FinText Alpha Vectorizer gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlist for local development placeholders and non-secret configuration"
paths = [
  '''\.env\.example$''',
  '''config/config\.yaml$''',
]

regexes = [
  '''sk_live_xxxx''',
  '''sk_test_mock_stripe_key_for_dev''',
  '''your_polygon_api_key_here''',
  '''your_finnhub_api_key_here''',
  '''whsec_xxxx''',
  '''POSTGRES_PASSWORD:\s*fintext''',
  '''POSTGRES_USER:\s*fintext''',
  '''postgres://fintext:fintext@localhost:5432/fintext_metadata''',
]

# docker-compose.yml dev credentials allowlist (local dev only, not production)
[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "Local dev credentials in docker-compose.yml"
regexTarget = "match"
paths = ['''docker-compose\.yml$''']
regexes = [
  '''POSTGRES_PASSWORD:\s*fintext''',
  '''POSTGRES_USER:\s*fintext''',
]
