# ══════════════════════════════════════════════════════════════════════════════
# FinText-Alpha-Vectorizer — Alertmanager Deployment & Slack Routing
# ══════════════════════════════════════════════════════════════════════════════
# Routes critical and warning alerts to Slack channel #fintext-ops-alerts.
# ══════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: default
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
    app.kubernetes.io/component: alert-router
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: "https://hooks.slack.com/services/PLACEHOLDER/FINTextALERTS/WEBHOOKURL"

    route:
      group_by: ['alertname', 'service', 'tier']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-notifications'
      routes:
        - match:
            severity: critical
          receiver: 'slack-notifications'
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: 'slack-notifications'
          repeat_interval: 6h

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']

    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - channel: '#fintext-ops-alerts'
            send_resolved: true
            icon_emoji: ':rotating_light:'
            username: 'FinText-Alpha Alertmanager'
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity | toUpper }})'
            text: >-
              {{ range .Alerts }}
              *Alert Summary:* {{ .Annotations.summary }}
              *Details:* {{ .Annotations.description }}
              *Severity:* `{{ .Labels.severity }}` | *Tier:* `{{ .Labels.tier }}` | *Service:* `{{ .Labels.service }}`
              {{ if .Annotations.runbook_url }}*Runbook:* <{{ .Annotations.runbook_url }}|Standard Operating Procedure>{{ end }}
              {{ end }}

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: default
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
    app.kubernetes.io/component: alert-router
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9093
      targetPort: 9093
  selector:
    app.kubernetes.io/name: alertmanager

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: default
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
    app.kubernetes.io/component: alert-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: fintext-alpha-vectorizer
        app.kubernetes.io/component: alert-router
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=http://alertmanager:9093"
          ports:
            - name: http
              containerPort: 9093
          env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: fintext-alerting
                  key: slack-webhook-url
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
            items:
              - key: alertmanager.yml
                path: alertmanager.yml
        - name: data
          emptyDir: {}
