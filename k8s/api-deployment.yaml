# ══════════════════════════════════════════════════════════════════════════════
# FinText-Alpha-Vectorizer — API Gateway Deployment (Single-Region K8s)
# ══════════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintext-api
  namespace: default
  labels:
    app.kubernetes.io/name: fintext-api
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
    app.kubernetes.io/component: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fintext-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fintext-api
        app.kubernetes.io/part-of: fintext-alpha-vectorizer
        app.kubernetes.io/component: api-gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fintext-api
          image: fintext-alpha-vectorizer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          env:
            - name: PRODUCTION_MODE
              value: "1"
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: POLYGON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fintext-api-secret
                  key: POLYGON_API_KEY
                  optional: true
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fintext-api-secret
                  key: API_SECRET_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: fintext-data
              mountPath: /app/data/db
      volumes:
        - name: fintext-data
          persistentVolumeClaim:
            claimName: fintext-data-pvc
