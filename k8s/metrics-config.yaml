apiVersion: v1
kind: ConfigMap
metadata:
  name: fintext-metrics-adapter-config
  namespace: default
  labels:
    app.kubernetes.io/name: custom-metrics-adapter
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
data:
  config.yaml: |
    rules:
      # ── Rule 1: Expose Active WebSocket Streaming Connections per Pod ─────
      - seriesQuery: 'fintext_websocket_active_connections{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "fintext_websocket_active_connections"
          as: "websocket_active_connections"
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

      # ── Rule 2: Expose Kafka / Redpanda Ingestion Consumer Group Lag ───────
      - seriesQuery: 'kafka_consumergroup_lag{topic="sentiment-events"}'
        resources:
          namespaced: false
        name:
          matches: "kafka_consumergroup_lag"
          as: "kafka_consumergroup_lag"
        metricsQuery: 'sum(kafka_consumergroup_lag{topic="sentiment-events"})'

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fintext-api-servicemonitor
  namespace: default
  labels:
    release: prometheus
    app.kubernetes.io/name: fintext-api
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fintext-api
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
