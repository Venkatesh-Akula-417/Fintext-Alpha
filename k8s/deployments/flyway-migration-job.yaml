# ══════════════════════════════════════════════════════════════════════════════
# FinText-Alpha-Vectorizer — Flyway Automated Schema Migration Job
# ══════════════════════════════════════════════════════════════════════════════
# Executes backward-compatible Expand-Contract schema updates prior to canary rollout.
# ══════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-migrations
  namespace: default
  labels:
    app.kubernetes.io/name: flyway-migration
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
data:
  V1__init_metadata_schema.sql: |
    -- Baseline Metadata & Signal Registry Table
    CREATE TABLE IF NOT EXISTS signals (
        signal_id VARCHAR(64) PRIMARY KEY,
        ticker VARCHAR(16) NOT NULL,
        timestamp TIMESTAMPTZ NOT NULL,
        sentiment_score DOUBLE PRECISION NOT NULL,
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS pipeline_job_checkpoints (
        job_id VARCHAR(64) PRIMARY KEY,
        component_name VARCHAR(64) NOT NULL,
        last_processed_timestamp TIMESTAMPTZ NOT NULL,
        records_processed BIGINT DEFAULT 0,
        status VARCHAR(32) DEFAULT 'RUNNING',
        updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );

  V2__expand_vpin_and_dealer_gex.sql: |
    -- Expand Phase: Add quantitative microstructure fields non-destructively
    ALTER TABLE signals ADD COLUMN IF NOT EXISTS vpin DOUBLE PRECISION DEFAULT 0.0;
    ALTER TABLE signals ADD COLUMN IF NOT EXISTS dealer_net_gex DOUBLE PRECISION DEFAULT 0.0;
    ALTER TABLE signals ADD COLUMN IF NOT EXISTS lead_lag_correlation DOUBLE PRECISION DEFAULT 0.0;

---
apiVersion: batch/v1
kind: Job
metadata:
  name: flyway-db-migration
  namespace: default
  labels:
    app.kubernetes.io/name: flyway-migration
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flyway-migration
        app.kubernetes.io/part-of: fintext-alpha-vectorizer
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: flyway/flyway:10.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "migrate"
          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://postgres-meta:5432/fintext_metadata"
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-meta-secret
                  key: POSTGRES_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-meta-secret
                  key: POSTGRES_PASSWORD
            - name: FLYWAY_CONNECT_RETRIES
              value: "10"
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: sql-migrations
              mountPath: /flyway/sql
      volumes:
        - name: sql-migrations
          configMap:
            name: flyway-migrations
