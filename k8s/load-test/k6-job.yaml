# ══════════════════════════════════════════════════════════════════════════════
# FinText-Alpha-Vectorizer — Kubernetes k6 Load Test Certification Job
# ══════════════════════════════════════════════════════════════════════════════
# Executes an automated 100 VU / 30s load testing drill against the API gateway
# inside the staging/production cluster to certify P95 < 500ms SLA compliance.
# ══════════════════════════════════════════════════════════════════════════════

apiVersion: batch/v1
kind: Job
metadata:
  name: fintext-load-test-k6
  namespace: default
  labels:
    app.kubernetes.io/name: fintext-load-test
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
    app.kubernetes.io/component: performance-certification
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fintext-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: k6-load-tester
          image: grafana/k6:latest
          args:
            - "run"
            - "--out"
            - "json=/tmp/results/k6_raw_results.json"
            - "/scripts/load_test.js"
          env:
            - name: API_BASE_URL
              value: "http://fintext-api:8000"
            - name: K6_VUS
              value: "100"
            - name: K6_DURATION
              value: "30s"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fintext-secrets
                  key: admin-token
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: k6-scripts
              mountPath: /scripts
              readOnly: true
            - name: k6-results
              mountPath: /tmp/results
      volumes:
        - name: k6-scripts
          configMap:
            name: fintext-k6-scripts
            defaultMode: 0755
        - name: k6-results
          emptyDir: {}
