# ══════════════════════════════════════════════════════════════════════════════
# FinText-Alpha-Vectorizer — PostgreSQL Metadata & Job Coordination Store
# ══════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Secret
metadata:
  name: postgres-meta-secret
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-meta
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
type: Opaque
stringData:
  POSTGRES_USER: "fintext_admin"
  POSTGRES_PASSWORD: "FinTextSecureMetaPassword2026!"
  POSTGRES_DB: "fintext_metadata"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-meta-headless
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-meta
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres-meta

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-meta
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-meta
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres-meta

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-meta
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-meta
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
    app.kubernetes.io/component: metadata-store
spec:
  serviceName: "postgres-meta-headless"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-meta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-meta
        app.kubernetes.io/part-of: fintext-alpha-vectorizer
        app.kubernetes.io/component: metadata-store
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-meta-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-meta-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-meta-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U fintext_admin -d fintext_metadata -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U fintext_admin -d fintext_metadata -h 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
        labels:
          app.kubernetes.io/name: postgres-meta
          app.kubernetes.io/part-of: fintext-alpha-vectorizer
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-meta-pdb
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-meta
    app.kubernetes.io/part-of: fintext-alpha-vectorizer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-meta
