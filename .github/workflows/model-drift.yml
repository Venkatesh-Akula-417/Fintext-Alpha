name: Model Drift Monitor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-monitor:
    name: Model Drift & Calibration Monitoring
    runs-on: windows-latest
    continue-on-error: true  # P1: Python 3.11 ONNX INT8 kernel divergence — see docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-validation.txt

      - name: Fetch Model Assets (Optional)
        if: always()
        continue-on-error: true
        run: |
          python scripts/fetch_models.py --manifest config/models_manifest.json

      - name: Diagnostic — Print Runtime Versions
        run: |
          python -c "import onnxruntime; print('ORT_VERSION:', onnxruntime.__version__); print('AVAILABLE_PROVIDERS:', onnxruntime.get_available_providers())"
          python -c "import numpy; print('NUMPY_VERSION:', numpy.__version__)"
          python -c "import transformers; print('TRANSFORMERS_VERSION:', transformers.__version__)"

      - name: Check model presence
        id: check-model
        shell: pwsh
        run: |
          if (-not (Test-Path "models/finbert-finetuned/model.onnx") -and -not (Test-Path "models/finbert-finetuned/finbert.onnx")) {
            Write-Host "::warning::Model artifacts not present; skipping model drift monitoring."
            "SKIPPED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "SKIPPED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Run Model Drift Monitor
        shell: pwsh
        run: |
          if ($env:SKIPPED -eq "true") {
            Write-Host "Running drift monitor in SKIP verification mode..."
            python scripts/model_drift_monitor.py `
              --dataset config/model_validation_dataset.json `
              --model-dir models/finbert-finetuned `
              --baseline data/model-drift/baseline.json `
              --output-dir data/model-drift `
              --report-path docs/MODEL_DRIFT_REPORT.md
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 3) {
              Write-Host "Harness exited with code 3 (clean SKIP as expected)."
            } else {
              Write-Host "Unexpected exit code: $exitCode"
              exit $exitCode
            }
          } else {
            python scripts/model_drift_monitor.py `
              --dataset config/model_validation_dataset.json `
              --model-dir models/finbert-finetuned `
              --baseline data/model-drift/baseline.json `
              --output-dir data/model-drift `
              --report-path docs/MODEL_DRIFT_REPORT.md
          }

      - name: Upload drift reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-drift-report
          path: |
            data/model-drift/*.json
            data/model-drift/*.jsonl
            docs/MODEL_DRIFT_REPORT.md
          if-no-files-found: warn
