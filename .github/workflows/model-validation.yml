name: Model Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-validation:
    name: FinBERT Model Quality & Calibration Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies from requirements-model-validation.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-model-validation.txt

      - name: Fetch Model Assets (Optional)
        if: always()
        continue-on-error: true
        run: |
          python scripts/fetch_models.py --manifest config/models_manifest.json

      - name: Diagnostic — Print Runtime Versions
        run: |
          python -c "import onnxruntime; print('ORT_VERSION:', onnxruntime.__version__); print('AVAILABLE_PROVIDERS:', onnxruntime.get_available_providers())"
          python -c "import numpy; print('NUMPY_VERSION:', numpy.__version__)"
          python -c "import transformers; print('TRANSFORMERS_VERSION:', transformers.__version__)"

      - name: Check model presence
        id: check-model
        shell: pwsh
        run: |
          if (-not (Test-Path "models/finbert-finetuned/model.onnx") -and -not (Test-Path "models/finbert-finetuned/finbert.onnx")) {
            Write-Host "::warning::Model artifacts not present; skipping model validation."
            "SKIPPED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "SKIPPED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # CPU-only GitHub runner: 250 ms threshold accommodates cold-start ONNX Runtime + single-thread tokenizer overhead. See docs/LATENCY_RECONCILIATION.md.
      - name: Run Model Quality Validation
        shell: pwsh
        run: |
          if ($env:SKIPPED -eq "true") {
            Write-Host "Running harness in SKIP verification mode..."
            python scripts/validate_model_quality.py `
              --dataset config/model_validation_dataset.json `
              --model-dir models/finbert-finetuned `
              --output-dir data/model-validation `
              --report-path docs/MODEL_VALIDATION_REPORT.md
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 3) {
              Write-Host "Harness exited with code 3 (clean SKIP as expected)."
            } else {
              Write-Host "Unexpected exit code: $exitCode"
              exit $exitCode
            }
          } else {
            python scripts/validate_model_quality.py `
              --dataset config/model_validation_dataset.json `
              --model-dir models/finbert-finetuned `
              --output-dir data/model-validation `
              --report-path docs/MODEL_VALIDATION_REPORT.md `
              --max-latency-p95-ms 250.0 `
              --environment cpu-ci
          }

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-validation-report
          path: |
            data/model-validation/*.json
            docs/MODEL_VALIDATION_REPORT.md
          if-no-files-found: warn
