[package]
name = "fintext_html_sanitizer"
version = "0.1.0"
edition = "2021"
description = "Ultra-high-performance native HTML sanitizer and text/link extractor in Rust"
authors = ["FinText Alpha Engineering Team"]

[lib]
name = "fintext_html_sanitizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
scraper = "0.18"
regex = "1.10"
once_cell = "1.19"
