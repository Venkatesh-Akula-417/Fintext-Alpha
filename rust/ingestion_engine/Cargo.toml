[package]
name = "fintext_ingestion_engine"
version = "0.1.0"
edition = "2021"
description = "High-Performance Rust Ingestion Engine & Native ONNX Sentiment Pipeline for FinText-Alpha-Vectorizer"
authors = ["FinText Alpha Engineering Team"]

[lib]
name = "fintext_ingestion_engine"
path = "src/lib.rs"

[[bin]]
name = "fintext_ingestion"
path = "src/main.rs"

[[bin]]
name = "backfill_timescaledb"
path = "src/bin/backfill_timescaledb.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
once_cell = "1.19"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.4", features = ["load-dynamic", "tensorrt", "cuda"] }
rdkafka = { version = "0.36", features = ["tokio", "cmake-build"] }
bytes = "1.5"
hound = "3.5"
whisper-rs = "0.11"
nalgebra = "0.33"
dotenv = "0.15"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }

# Raw Data Archive (Apache Parquet & S3/MinIO Object Storage)
parquet = { version = "53", features = ["arrow"] }
arrow = "53"
aws-sdk-s3 = { version = "=1.38.0", default-features = false, features = ["rustls", "rt-tokio"] }

# In-process Rust sidecars
fintext_html_sanitizer = { path = "../html_sanitizer" }
fintext_ticker_extractor = { path = "../ticker_extractor" }
fintext_spam_detector = { path = "../spam_detector" }
fintext_event_classifier = { path = "../event_classifier" }
