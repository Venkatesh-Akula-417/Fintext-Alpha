[package]
name = "fintext_dead_letter_worker"
version = "0.1.0"
edition = "2021"
description = "Dead Letter Queue (DLQ) Auto-Reprocessing and Quarantine Worker for FinText Alpha Vectorizer"
authors = ["FinText Alpha Engineering Team"]

[lib]
name = "fintext_dead_letter_worker"
path = "src/lib.rs"

[[bin]]
name = "dead_letter_worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
rdkafka = { version = "0.36", features = ["tokio", "cmake-build"] }
aws-sdk-s3 = { version = "=1.38.0", default-features = false, features = ["rustls", "rt-tokio"] }
aws-config = { version = "=1.5.0", default-features = false, features = ["rustls", "behavior-version-latest"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dotenv = "0.15"
futures = "0.3"
dashmap = "5.5"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
