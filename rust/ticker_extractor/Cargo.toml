[package]
name = "fintext_ticker_extractor"
version = "0.1.0"
edition = "2021"
description = "High-performance native stock symbol (ticker) extractor and entity disambiguator in Rust"
authors = ["FinText Alpha Engineering Team"]

[lib]
name = "fintext_ticker_extractor"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
regex = "1.10"
once_cell = "1.19"
