[package]
name = "fintext_observability_anomaly"
version = "0.1.0"
edition = "2021"
description = "AI Latency & Error Anomaly Detection Engine for FinText Alpha Vectorizer"
authors = ["FinText Alpha Engineering Team"]

[lib]
name = "fintext_observability_anomaly"
path = "src/lib.rs"

[[bin]]
name = "fintext_anomaly_detector"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dotenv = "0.15"
