[package]
name = "fintext_spam_detector"
version = "0.1.0"
edition = "2021"
description = "High-performance sliding-window spam and market manipulation detector in Rust"
authors = ["FinText Alpha Engineering Team"]

[lib]
name = "fintext_spam_detector"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
regex = "1.10"
once_cell = "1.19"
