[package]
name = "fintext_rust_sidecar"
version = "0.1.0"
edition = "2021"
description = "Standalone high-throughput Rust sidecar binary for GIL-free batch preprocessing & NLP extraction"
authors = ["FinText Alpha Engineering Team"]

[[bin]]
name = "fintext_sidecar"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"
regex = "1.10"
scraper = "0.18"
once_cell = "1.19"
warp = "0.3"
